<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gincana Matemática - Mapa das Bandeiras</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 { font-size: 24px; color: #2c3e50; }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        canvas {
            border: 2px solid #000;
            background-color: #fff;
            cursor: crosshair;
        }
        .legend {
            display: flex;
            gap: 15px;
            margin-top: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .legend-item { display: flex; align-items: center; font-weight: bold; }
        .dot {
            width: 12px; height: 12px; border-radius: 50%; margin-right: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Terreno da Escola - Posição das Bandeiras</h1>
        <p>Distância simulada entre P e Q ajustada para validar todas as interseções.</p>
        <canvas id="terreno" width="800" height="500"></canvas>
        
        <div class="legend">
            <div class="legend-item"><div class="dot" style="background: black;"></div>P e Q</div>
            <div class="legend-item"><div class="dot" style="background: magenta;"></div>Magenta (M)</div>
            <div class="legend-item"><div class="dot" style="background: blue;"></div>Azul (A)</div>
            <div class="legend-item"><div class="dot" style="background: purple;"></div>Roxa (R1 e R2)</div>
            <div class="legend-item"><div class="dot" style="background: green;"></div>Verde (V)</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('terreno');
        const ctx = canvas.getContext('2d');

        // Escala: 1mm = 5 pixels (para ficar visível na tela)
        const scale = 5;

        // Posições de P e Q no canvas (simulando a inclinação do papel)
        const P = { x: 250, y: 350 };
        const Q = { x: 600, y: 400 };

        // Distância entre P e Q no canvas
        const d_px = Math.sqrt(Math.pow(Q.x - P.x, 2) + Math.pow(Q.y - P.y, 2));
        const d_mm = d_px / scale; 

        // Valores base em mm
        const a = 60, b = 35, c = 20;

        // --- CÁLCULO DOS VALORES DE X E Y (em mm) ---
        // 1. Magenta
        const x_M = (a * b) / c;
        const y_M = (a * a) / (c + b);

        // 2. Azul
        const x_A = Math.sqrt(a * b);
        const y_A = (b * c) / (2 * b - a);

        // 3. Roxa (Bhaskara: z^2 - 95z + 1600 = 0)
        // x+y = 95; sqrt(x*y) = 40 => x*y = 1600
        const delta_R = Math.pow(95, 2) - 4 * 1600;
        const R_sol1 = (95 + Math.sqrt(delta_R)) / 2;
        const R_sol2 = (95 - Math.sqrt(delta_R)) / 2;
        const x_R1 = R_sol1, y_R1 = R_sol2; // Bandeira Roxa 1
        const x_R2 = R_sol2, y_R2 = R_sol1; // Bandeira Roxa 2

        // 4. Verde (Bhaskara: y^2 + 55y - 3600 = 0)
        // x-y = 55 => x = y+55; sqrt(x*y) = 60 => x*y = 3600
        const delta_V = Math.pow(55, 2) - 4 * (-3600);
        const y_V = (-55 + Math.sqrt(delta_V)) / 2;
        const x_V = y_V + 55;

        // Lista de bandeiras para desenhar
        const flags = [
            { name: 'M', x: x_M, y: y_M, color: 'magenta' },
            { name: 'A', x: x_A, y: y_A, color: 'blue' },
            { name: 'R1', x: x_R1, y: y_R1, color: 'purple' },
            { name: 'R2', x: x_R2, y: y_R2, color: 'purple' },
            { name: 'V', x: x_V, y: y_V, color: 'green' }
        ];

        // Função para encontrar interseção de 2 círculos
        function findIntersections(x0, y0, r0, x1, y1, r1) {
            let dx = x1 - x0;
            let dy = y1 - y0;
            let d = Math.sqrt((dy*dy) + (dx*dx));

            if (d > (r0 + r1) || d < Math.abs(r0 - r1) || d === 0) return null; // Não há interseção

            let a = ((r0*r0) - (r1*r1) + (d*d)) / (2.0 * d);
            let x2 = x0 + (dx * a/d);
            let y2 = y0 + (dy * a/d);
            let h = Math.sqrt((r0*r0) - (a*a));
            let rx = -dy * (h/d);
            let ry = dx * (h/d);

            return [
                { x: x2 + rx, y: y2 + ry },
                { x: x2 - rx, y: y2 - ry }
            ];
        }

        // Desenhar P e Q
        function drawPoint(pt, label, color) {
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, 5, 0, 2 * Math.PI);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.fillStyle = "#000";
            ctx.font = "16px Arial";
            ctx.fillText(label, pt.x + 10, pt.y + 10);
        }

        drawPoint(P, 'P', 'black');
        drawPoint(Q, 'Q', 'black');

        // Desenhar Bandeiras
        flags.forEach(flag => {
            let r0 = flag.x * scale;
            let r1 = flag.y * scale;
            let pts = findIntersections(P.x, P.y, r0, Q.x, Q.y, r1);
            
            if (pts) {
                // Seleciona o ponto que fica "para cima" no papel (menor Y no canvas)
                let pt = pts[0].y < pts[1].y ? pts[0] : pts[1];
                
                // Desenhar arcos guias
                ctx.beginPath();
                ctx.arc(P.x, P.y, r0, 0, 2 * Math.PI);
                ctx.strokeStyle = "rgba(0,0,0,0.05)";
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(Q.x, Q.y, r1, 0, 2 * Math.PI);
                ctx.stroke();

                // Desenhar o ponto da bandeira
                drawPoint(pt, flag.name, flag.color);
            } else {
                console.log(`Bandeira ${flag.name} não faz interseção no plano (Escala ou distância PQ incorreta).`);
            }
        });
    </script>
</body>
</html>
